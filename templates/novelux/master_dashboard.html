{% load static %}
<!DOCTYPE html>
<html lang="en" class="light">
<head>
<script>(function(){var t=localStorage.getItem('nux_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.classList.toggle('dark',t==='dark');})()</script>
<meta charset="UTF-8"/>
<link rel="icon" type="image/png" href="{% static 'novelux/images/favicon_circle.png' %}">
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="nux-token" content="{{ access_token }}">
<meta name="nux-api" content="{{ api_url|default:'/api' }}">
<meta name="robots" content="noindex,nofollow">
<title>Master Dashboard – HuxNovel</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#fff;--fg:#171717;--primary:hsl(14 62% 38%);--muted:#f5f5f5;--muted-fg:#737373;--border:#e5e5e5;--card:#fafafa;--sw:228px;--role:hsl(14 62% 42%);--ok:hsl(142 60% 38%);--bad:hsl(0 70% 48%);--warn:hsl(38 92% 45%);}
html.dark{--bg:#0f0f11;--fg:#e5e5e5;--muted:#1c1c20;--muted-fg:#8a8a90;--border:#2a2a30;--card:#141417;--ok:hsl(142 60% 55%);--bad:hsl(0 70% 62%);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Geist',sans-serif;font-size:14px;background:var(--bg);color:var(--fg);min-height:100vh;}
button,input,select{font-family:inherit;font-size:inherit;}
button{cursor:pointer;}
a{color:inherit;text-decoration:none;}
.layout{display:flex;min-height:100vh;}
.sb{width:var(--sw);flex-shrink:0;border-right:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:40;transform:translateX(-100%);transition:transform .2s;}
.sb.open{transform:translateX(0);}
@media(min-width:1024px){.sb{transform:none!important;position:sticky;top:0;height:100vh;}}
.sb-top{padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.brand-logo{width:24px;height:24px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:12px;}
.brand{font-size:14px;font-weight:700;letter-spacing:.03em;}
.brand small{display:block;font-size:10px;font-weight:600;color:var(--role);letter-spacing:.14em;text-transform:uppercase;}
.sb-nav{padding:12px 10px;flex:1;display:flex;flex-direction:column;gap:1px;overflow-y:auto;}
.nbtn{display:flex;align-items:center;gap:10px;padding:9px 10px;font-size:13px;color:var(--muted-fg);width:100%;border:none;background:none;border-radius:7px;text-align:left;}
.nbtn:hover{background:var(--muted);color:var(--fg);}
.nbtn.active{background:color-mix(in srgb,var(--role) 11%,transparent);color:var(--role);font-weight:600;}
.nbtn svg{width:16px;height:16px;flex-shrink:0;}
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-left:auto;box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent);animation:pulse 1.6s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 55%,transparent);}70%{box-shadow:0 0 0 8px transparent;}100%{box-shadow:0 0 0 0 transparent;}}
.sb-bot{padding:14px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--muted-fg);}
.main{flex:1;min-width:0;}
.topbar{position:sticky;top:0;z-index:30;height:54px;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:10px;}
@media(min-width:1024px){.topbar{padding:0 24px;}.menu-btn{display:none!important;}}
.topbar h1{font-size:16px;font-weight:600;}
.tr{display:flex;align-items:center;gap:8px;}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:var(--bg);color:var(--fg);border-radius:8px;}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.seg button{border:none;background:none;padding:6px 10px;font-size:12px;color:var(--muted-fg);}
.seg button.on{background:var(--role);color:#fff;}
.content{padding:18px 16px 60px;max-width:1500px;}
@media(min-width:1024px){.content{padding:22px 24px 60px;}}
.page{display:none;}
.page.active{display:block;}
.grid{display:grid;gap:12px;}
.kpis{grid-template-columns:repeat(2,minmax(0,1fr));}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));}}
@media(min-width:1200px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr));}}
.two{grid-template-columns:1fr;}
@media(min-width:1000px){.two{grid-template-columns:1fr 1fr;}.two-1{grid-template-columns:2fr 1fr;}}
.card{border:1px solid var(--border);background:var(--card);border-radius:12px;padding:14px 16px;min-width:0;}
.card h3{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.card h3 .sub{font-weight:400;color:var(--muted-fg);font-size:12px;margin-left:auto;}
.kpi .k{font-size:11px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.06em;}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em;}
.kpi .s{font-size:11px;color:var(--muted-fg);margin-top:2px;}
.kpi.hl .v{color:var(--role);}
.chart{position:relative;height:220px;}
.chart.sm{height:160px;}
.tbl{width:100%;border-collapse:collapse;font-size:13px;}
.tbl th{text-align:left;font-weight:500;font-size:11px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.05em;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap;}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
.tbl tr.click{cursor:pointer;}
.tbl tr.click:hover td{background:color-mix(in srgb,var(--role) 5%,transparent);}
.scroll{overflow-x:auto;}
.muted{color:var(--muted-fg);}
.sm{font-size:12px;}
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;font-size:11px;font-weight:500;border-radius:5px;background:var(--muted);color:var(--muted-fg);white-space:nowrap;}
.bdg.ok{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok);}
.bdg.bad{background:color-mix(in srgb,var(--bad) 13%,transparent);color:var(--bad);}
.bdg.role{background:color-mix(in srgb,var(--role) 12%,transparent);color:var(--role);}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--border);flex-shrink:0;}
.dot.on{background:var(--ok);}
.av{width:30px;height:30px;border-radius:50%;background:var(--role);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;flex-shrink:0;overflow:hidden;}
.av img{width:100%;height:100%;object-fit:cover;}
.who{display:flex;align-items:center;gap:9px;min-width:0;}
.who b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar{height:8px;border-radius:5px;background:var(--muted);overflow:hidden;}
.bar>i{display:block;height:100%;background:var(--role);border-radius:5px;}
.row{display:flex;align-items:center;gap:10px;}
.list-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);}
.list-row:last-child{border-bottom:none;}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--fg);}
.filters input{flex:1;min-width:200px;}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--fg);font-size:13px;}
.btn.p{background:var(--role);border-color:var(--role);color:#fff;}
.pager{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:12px;font-size:13px;}
.empty{padding:30px;text-align:center;color:var(--muted-fg);}
.big{font-size:52px;font-weight:800;letter-spacing:-.03em;color:var(--role);line-height:1;}
.stream{max-height:520px;overflow-y:auto;}
.ev{display:grid;grid-template-columns:62px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.ev time{color:var(--muted-fg);font-size:11px;}
/* Drawer */
.dr-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;display:none;}
.dr-bg.open{display:block;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1100px,100vw);background:var(--bg);z-index:90;transform:translateX(100%);transition:transform .22s;display:flex;flex-direction:column;border-left:1px solid var(--border);}
.drawer.open{transform:none;}
.dr-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.dr-head .av{width:44px;height:44px;font-size:16px;}
.dr-body{flex:1;overflow-y:auto;padding:16px 18px 50px;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);padding:0 18px;overflow-x:auto;}
.tabs button{border:none;background:none;padding:10px 10px;font-size:13px;color:var(--muted-fg);border-bottom:2px solid transparent;white-space:nowrap;}
.tabs button.on{color:var(--role);border-color:var(--role);font-weight:600;}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px 18px;}
.kv .k{font-size:11px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.05em;}
.kv .v{font-size:13.5px;margin-top:2px;word-break:break-word;}
.heat{display:grid;grid-template-columns:34px repeat(24,1fr);gap:2px;font-size:10px;color:var(--muted-fg);}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--muted);}
.tl-item{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.tl-item .when{color:var(--muted-fg);font-size:12px;}
.loading{padding:40px;text-align:center;color:var(--muted-fg);}
.err{padding:14px;border:1px solid var(--bad);color:var(--bad);border-radius:10px;margin-bottom:12px;}
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none;}
.ovl.show{display:block;}

/* Replay — phone mockup */
.rp-wrap{display:grid;grid-template-columns:1fr;gap:16px;}
@media(min-width:900px){.rp-wrap{grid-template-columns:340px 1fr;}}
.phone{width:320px;height:660px;margin:0 auto;border-radius:44px;background:#0b0b0d;padding:12px;box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 0 0 2px #2a2a30;position:relative;}
.phone::before{content:'';position:absolute;top:18px;left:50%;transform:translateX(-50%);width:96px;height:24px;background:#000;border-radius:14px;z-index:5;}
.scr{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#0d0d0f;color:#f2f2f7;position:relative;font-size:12px;display:flex;flex-direction:column;}
.scr .sbar{height:40px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 6px;font-size:11px;font-weight:600;flex-shrink:0;}
.scr .body{flex:1;overflow:hidden;position:relative;animation:scrIn .35s ease;}
@keyframes scrIn{from{opacity:0;transform:translateX(18px);}to{opacity:1;transform:none;}}
.scr .nav{height:52px;border-top:1px solid #222;display:flex;justify-content:space-around;align-items:center;font-size:9.5px;color:#777;flex-shrink:0;}
.scr .nav b{display:block;text-align:center;font-size:15px;line-height:1;}
.scr .nav .on{color:#C15F3C;}
.a-head{display:flex;align-items:center;gap:8px;padding:6px 14px 10px;}
.a-head .lg{width:22px;height:22px;border-radius:6px;background:#C15F3C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;}
.a-search{margin:0 14px 10px;background:#1c1c20;border-radius:20px;padding:9px 12px;color:#888;}
.a-sec{padding:4px 14px;font-weight:700;font-size:13px;}
.a-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px 14px;}
.a-grid>div{min-width:0;}
.cv{aspect-ratio:3/4;border-radius:8px;background:linear-gradient(135deg,#C15F3C,#5b2412);overflow:hidden;display:flex;align-items:flex-end;padding:5px;font-size:9px;font-weight:700;color:#fff;background-size:cover;background-position:center;}
.a-btn{background:#C15F3C;color:#fff;border-radius:22px;text-align:center;padding:11px;font-weight:700;margin:12px 14px;}
.a-sheet{position:absolute;left:0;right:0;bottom:0;background:#1c1c20;border-radius:18px 18px 0 0;padding:16px;box-shadow:0 -10px 30px rgba(0,0,0,.5);animation:sheetUp .35s ease;}
@keyframes sheetUp{from{transform:translateY(100%);}to{transform:none;}}
.read{padding:8px 18px;font-family:Georgia,serif;font-size:12.5px;line-height:1.75;color:#e9e3d8;}
.tap{position:absolute;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none;animation:tap .7s ease-out forwards;}
@keyframes tap{from{transform:scale(.4);opacity:1;}to{transform:scale(1.6);opacity:0;}}
.rp-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;justify-content:center;}
.rp-tl{position:relative;height:28px;margin-top:12px;background:var(--muted);border-radius:6px;cursor:pointer;}
.rp-tl i{position:absolute;top:4px;bottom:4px;width:3px;border-radius:2px;background:var(--muted-fg);opacity:.5;}
.rp-tl i.k-read,.rp-tl i.k-unlock{background:var(--role);opacity:.9;}
.rp-tl .head{position:absolute;top:0;bottom:0;width:2px;background:var(--fg);}
.rp-list{max-height:560px;overflow-y:auto;}
.rp-item{display:grid;grid-template-columns:70px 1fr auto;gap:8px;padding:8px;border-radius:8px;cursor:pointer;font-size:12.5px;}
.rp-item:hover{background:var(--muted);}
.rp-item.on{background:color-mix(in srgb,var(--role) 12%,transparent);}
.live-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:12px;background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);font-size:11px;font-weight:700;}
</style>
</head>
<body>
<div class="layout">
  <aside class="sb" id="sb">
    <div class="sb-top">
      <div class="brand-logo">H</div>
      <div class="brand">HuxNovel<small>Master</small></div>
    </div>
    <nav class="sb-nav" id="nav">
      <button class="nbtn active" data-page="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>Overview</button>
      <button class="nbtn" data-page="realtime"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>Realtime<span class="live-dot"></span></button>
      <button class="nbtn" data-page="users"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Users</button>
      <button class="nbtn" data-page="audience"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>Audience</button>
      <button class="nbtn" data-page="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15l-3.5 2 1-4-3-2.6 4-.3L12 6l1.5 4.1 4 .3-3 2.6 1 4z"/><circle cx="12" cy="12" r="10"/></svg>Team</button>
      <button class="nbtn" data-page="books"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>Books</button>
      <button class="nbtn" data-page="revenue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>Revenue</button>
    </nav>
    <div class="sb-bot">Signed in as <b>{{ me.username }}</b><br><a href="/admin/novelux/database/" style="color:var(--role);">Django admin →</a></div>
  </aside>
  <div class="ovl" id="ovl" onclick="closeSb()"></div>

  <main class="main">
    <div class="topbar">
      <div class="row">
        <button class="icon-btn menu-btn" onclick="openSb()" aria-label="Menu">☰</button>
        <h1 id="ptitle">Overview</h1>
      </div>
      <div class="tr">
        <div class="seg" id="periodSeg">
          <button data-d="1">24h</button><button data-d="7">7d</button><button data-d="30" class="on">30d</button><button data-d="90">90d</button>
        </div>
        <button class="icon-btn" id="refreshBtn" title="Refresh">↻</button>
        <button class="icon-btn" id="themeBtn" title="Theme">◐</button>
      </div>
    </div>

    <div class="content">
      <section class="page active" id="page-overview"><div class="loading">Loading…</div></section>
      <section class="page" id="page-realtime"><div class="loading">Loading…</div></section>
      <section class="page" id="page-users">
        <div class="filters">
          <input id="uq" placeholder="Search name, username, email or ID…">
          <select id="urole"><option value="">All roles</option><option value="reader">Readers</option><option value="author">Authors</option><option value="se">Senior editors</option><option value="ce">Chief editors</option><option value="admin">Admins</option></select>
          <select id="ustatus"><option value="">Everyone</option><option value="online">Online now</option><option value="active7">Active in 7 days</option><option value="dormant">Inactive 30+ days</option><option value="paying">Paying</option><option value="vip">VIP</option><option value="banned">Banned</option></select>
          <select id="usort"><option value="last_seen">Last seen</option><option value="joined">Newest</option><option value="spent">Top spenders</option><option value="coins">Most coins</option></select>
        </div>
        <div class="card"><div class="scroll" id="userTable"><div class="loading">Loading…</div></div>
          <div class="pager" id="userPager"></div></div>
      </section>
      <section class="page" id="page-audience"><div class="loading">Loading…</div></section>
      <section class="page" id="page-team"><div class="loading">Loading…</div></section>
      <section class="page" id="page-books"><div class="loading">Loading…</div></section>
      <section class="page" id="page-revenue"><div class="loading">Loading…</div></section>
    </div>
  </main>
</div>

<!-- Detail drawer (user / editor) -->
<div class="dr-bg" id="drBg" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="dr-head" id="drHead"></div>
  <div class="tabs" id="drTabs"></div>
  <div class="dr-body" id="drBody"></div>
</aside>

<script>
// ── API ──────────────────────────────────────────────────────────────────────
const API = {
  token: document.querySelector('meta[name="nux-token"]').content,
  base: document.querySelector('meta[name="nux-api"]').content || '/api',
  async get(path, retry = true) {
    const r = await fetch(this.base + path, { headers: { 'Authorization': 'Bearer ' + this.token } });
    if (r.status === 401 && retry) {
      // Access tokens last an hour — get a fresh one and try again
      const t = await fetch('/master/token/', { credentials: 'same-origin' });
      if (t.ok) { this.token = (await t.json()).access; return this.get(path, false); }
      location.href = '/login/?next=/master/';
    }
    if (!r.ok) throw (await r.json().catch(() => ({ detail: 'Request failed (' + r.status + ')' })));
    return r.json();
  },
};

// ── Helpers ──────────────────────────────────────────────────────────────────
const $ = s => document.querySelector(s);
const _e = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const _n = v => Number(v || 0).toLocaleString();
const _usd = v => '$' + Number(v || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const _pct = v => (Number(v || 0) * 100).toFixed(1) + '%';
const _d = iso => iso ? new Date(iso).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
const _dd = iso => iso ? new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
function ago(iso) {
  if (!iso) return 'never';
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 86400 * 30) return Math.floor(s / 86400) + 'd ago';
  return _dd(iso);
}
const flag = cc => cc && cc.length === 2 ? String.fromCodePoint(...[...cc.toUpperCase()].map(c => 127397 + c.charCodeAt(0))) : '🌐';
function avatar(u) {
  return `<div class="av">${u.avatar ? `<img src="${_e(u.avatar)}" alt="">` : _e((u.username || '?')[0].toUpperCase())}</div>`;
}
function who(u, sub) {
  return `<div class="who">${avatar(u)}<div style="min-width:0;"><b>${_e(u.username)}</b><span class="muted sm">${sub ?? _e(u.email || '')}</span></div></div>`;
}
const roleBdg = (r, owner) => owner ? '<span class="bdg role">Owner</span>'
  : `<span class="bdg ${r === 'reader' ? '' : 'role'}">${_e({ reader: 'Reader', author: 'Author', se: 'Senior editor', ce: 'Chief editor', admin: 'Admin' }[r] || r)}</span>`;
const parts = (...xs) => xs.filter(Boolean).map(_e).join(' · ');
const err = e => `<div class="err">${_e(e?.detail || 'Something went wrong.')}</div>`;
const kpi = (k, v, s, hl) => `<div class="card kpi${hl ? ' hl' : ''}"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ''}</div>`;
function barList(rows, label, value, fmt = _n) {
  if (!rows.length) return '<div class="empty">No data yet.</div>';
  const max = Math.max(...rows.map(value), 1);
  return rows.map(r => `<div style="margin-bottom:9px;"><div class="row sm" style="justify-content:space-between;margin-bottom:3px;"><span>${label(r)}</span><b>${fmt(value(r))}</b></div><div class="bar"><i style="width:${(value(r) / max * 100).toFixed(1)}%"></i></div></div>`).join('');
}

// Charts (re-created on each render)
const charts = {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function chart(id, type, labels, datasets, opts = {}) {
  charts[id]?.destroy();
  const el = document.getElementById(id);
  if (!el) return;
  const role = css('--role'), grid = css('--border'), fg = css('--muted-fg');
  const palette = [role, 'hsl(210 70% 50%)', 'hsl(142 55% 42%)', 'hsl(38 90% 50%)', 'hsl(270 55% 55%)', 'hsl(190 70% 42%)', 'hsl(340 65% 52%)', '#888'];
  datasets.forEach((d, i) => {
    const c = d.color || palette[i % palette.length];
    if (type === 'doughnut') { d.backgroundColor = palette; d.borderWidth = 0; }
    else {
      d.borderColor = c; d.backgroundColor = type === 'bar' ? c : c.replace(')', ' / 12%)').replace('hsl(', 'hsl(');
      d.fill = type === 'line'; d.tension = .3; d.pointRadius = 0; d.borderWidth = 2;
    }
  });
  charts[id] = new Chart(el, {
    type, data: { labels, datasets },
    options: Object.assign({
      responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: datasets.length > 1 || type === 'doughnut', labels: { color: fg, boxWidth: 10, font: { family: 'Geist' } } } },
      scales: type === 'doughnut' ? {} : {
        x: { grid: { display: false }, ticks: { color: fg, maxTicksLimit: 8, font: { size: 10 } } },
        y: { grid: { color: grid }, ticks: { color: fg, font: { size: 10 } }, beginAtZero: true },
      },
    }, opts),
  });
}
const shortDate = d => new Date(d + 'T00:00').toLocaleDateString(undefined, { day: 'numeric', month: 'short' });

function openDrawer() { $('#drawer').classList.add('open'); $('#drBg').classList.add('open'); }
function closeDrawer() { Replay.stop(); $('#drawer').classList.remove('open'); $('#drBg').classList.remove('open'); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
function setTabs(tabs, render) {
  $('#drTabs').innerHTML = tabs.map((t, i) => `<button class="${i === 0 ? 'on' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('');
  $('#drTabs').querySelectorAll('button').forEach(b => b.onclick = () => {
    $('#drTabs').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    render(b.dataset.t);
  });
  render(tabs[0][0]);
}
const kv = pairs => `<div class="kv">${pairs.map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v ?? '—'}</div></div>`).join('')}</div>`;
const table = (head, rows, empty = 'Nothing yet.') => rows.length
  ? `<div class="scroll"><table class="tbl"><thead><tr>${head.map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c ?? '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
  : `<div class="empty">${empty}</div>`;

  Replay.stop();
  openDrawer();
  $('#drHead').innerHTML = '<div class="muted">Loading…</div>'; $('#drTabs').innerHTML = ''; $('#drBody').innerHTML = '';
  let d;
  try { d = await API.get('/master/users/' + id + '/'); }
  catch (e) { $('#drBody').innerHTML = err(e); return; }
  const p = d.profile, s = d.status;
  $('#drHead').innerHTML = `${avatar(p)}<div style="min-width:0;flex:1;">
      <div style="font-size:16px;font-weight:700;">${_e(p.username)} ${roleBdg(p.role, p.is_superuser)} ${p.is_vip ? '<span class="bdg ok">VIP</span>' : ''} ${p.is_banned ? '<span class="bdg bad">Banned</span>' : ''}</div>
      <div class="muted sm"><span class="dot ${s.online ? 'on' : ''}"></span> ${s.online ? 'Online now' : 'Last seen ' + ago(s.last_seen)} · ${_e(s.last_doing)} · ${_e(p.email)}</div></div>

    <button class="icon-btn" onclick="closeDrawer()">✕</button>`;
  const tabs = [['overview', 'Overview'], ['replay', '▶ Replay'], ['activity', 'Activity'], ['location', 'Location & IPs'], ['devices', 'Devices'], ['wallet', 'Wallet'], ['reading', 'Reading'], ['engagement', 'Engagement']];
  if (d.author) tabs.push(['author', 'Author']);

// ── Session replay (phone mockup) ────────────────────────────────────────────
// Screens are rebuilt from the app's requests — not a screen recording.
const Replay = {
  uid: null, data: null, i: 0, playing: false, speed: 4, timer: null, poll: null, live: false,
  stop() { clearTimeout(this.timer); clearTimeout(this.poll); this.playing = false; this.timer = this.poll = null; },
  async open(uid, { live = false, start = null } = {}) {
    this.stop();
    this.uid = uid; this.live = live;
    const b = $('#drBody');
    b.innerHTML = '<div class="loading">Rebuilding the session…</div>';
    try {
      this.data = await API.get(`/master/users/${uid}/replay/?` + (live ? 'live=1' : (start ? 'start=' + encodeURIComponent(start) : '')));
    } catch (e) { b.innerHTML = err(e); return; }
    this.i = live ? Math.max(0, this.data.screens.length - 1) : 0;
    this.layout();
    if (live) this.schedulePoll(); else if (this.data.screens.length) this.play();
  },
  layout() {
    const d = this.data, b = $('#drBody');
    const opts = d.sessions.map(x => `<option value="${_e(x.start)}" ${!this.live && x.start === d.window.start ? 'selected' : ''}>${_d(x.start)} · ${x.minutes} min · ${x.hits} requests</option>`).join('');
    b.innerHTML = `
      <div class="row" style="margin-bottom:12px;flex-wrap:wrap;gap:8px;">
        ${this.live ? '<span class="live-pill"><span class="live-dot" style="margin:0;background:var(--bad)"></span> LIVE · last 20 min</span>' : ''}
        <select id="rpSession" class="btn" style="max-width:360px;"><option value="">Choose a session…</option>${opts}</select>
        <button class="btn ${this.live ? 'p' : ''}" id="rpLive">${this.live ? 'Live on' : '● Watch live'}</button>
        <span class="muted sm" style="margin-left:auto;">Rebuilt from their app activity — not a screen recording.</span>
      </div>
      <div class="rp-wrap">
        <div>
          <div class="phone"><div class="scr" id="rpScr"></div></div>
          <div class="rp-ctl">
            <button class="btn" id="rpPrev">⏮</button>
            <button class="btn p" id="rpPlay" style="min-width:76px;">${this.playing ? '⏸ Pause' : '▶ Play'}</button>
            <button class="btn" id="rpNext">⏭</button>
            <div class="seg" id="rpSpeed">${[1, 4, 10, 20].map(x => `<button data-s="${x}" class="${x === this.speed ? 'on' : ''}">${x}×</button>`).join('')}</div>
          </div>
          <div class="rp-tl" id="rpTl"></div>
          <div class="muted sm" id="rpNow" style="text-align:center;margin-top:6px;"></div>
        </div>
        <div class="card"><h3>Screens <span class="sub">${d.screens.length} in ${this.live ? 'the last 20 minutes' : 'this session'}</span></h3>
          <div class="rp-list" id="rpList">${d.screens.map((sc, i) => `<div class="rp-item" data-i="${i}">
            <span class="muted">${new Date(sc.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}</span>
            <span>${_e(sc.doing)}${sc.story ? ` <span class="muted">· ${_e(sc.story.title)}</span>` : ''}</span>
            <span class="muted">${this.dur(sc)}</span></div>`).join('') || '<div class="empty">No activity in this window.</div>'}</div></div>
      </div>`;
    $('#rpSession').onchange = e => e.target.value && this.open(this.uid, { start: e.target.value });
    $('#rpLive').onclick = () => this.open(this.uid, { live: !this.live });
    $('#rpPlay').onclick = () => this.playing ? this.pause() : this.play();
    $('#rpPrev').onclick = () => this.go(this.i - 1);
    $('#rpNext').onclick = () => this.go(this.i + 1);
    $('#rpSpeed').querySelectorAll('button').forEach(x => x.onclick = () => {
      this.speed = Number(x.dataset.s);
      $('#rpSpeed').querySelectorAll('button').forEach(y => y.classList.toggle('on', y === x));
      if (this.playing) { clearTimeout(this.timer); this.schedule(); }
    });
    $('#rpList').querySelectorAll('.rp-item').forEach(x => x.onclick = () => { this.pause(); this.go(+x.dataset.i); });
    this.drawTimeline();
    this.show();
  },
  dur(sc) {
    const s = Math.max(0, (new Date(sc.until) - new Date(sc.at)) / 1000);
    return s < 60 ? Math.round(s) + 's' : Math.round(s / 60) + 'm';
  },
  drawTimeline() {
    const sc = this.data.screens, tl = $('#rpTl');
    if (!sc.length) { tl.innerHTML = ''; return; }
    const t0 = new Date(sc[0].at), t1 = new Date(sc[sc.length - 1].until), span = Math.max(1, t1 - t0);
    tl.innerHTML = sc.map(x => `<i class="k-${x.type}" style="left:${((new Date(x.at) - t0) / span * 100).toFixed(2)}%"></i>`).join('') + '<span class="head" id="rpHead"></span>';
    tl.onclick = e => {
      const r = tl.getBoundingClientRect(), at = +t0 + (e.clientX - r.left) / r.width * span;
      let k = 0; sc.forEach((x, j) => { if (+new Date(x.at) <= at) k = j; });
      this.go(k);
    };
  },
  go(i) {
    const n = this.data.screens.length;
    if (!n) return;
    this.i = Math.max(0, Math.min(n - 1, i));
    this.show();
    if (this.playing) { clearTimeout(this.timer); this.schedule(); }
  },
  play() {
    if (!this.data.screens.length) return;
    if (this.i >= this.data.screens.length - 1) this.i = 0;
    this.playing = true; $('#rpPlay') && ($('#rpPlay').textContent = '⏸ Pause');
    this.show(); this.schedule();
  },
  pause() { this.playing = false; clearTimeout(this.timer); $('#rpPlay') && ($('#rpPlay').textContent = '▶ Play'); },
  schedule() {
    const sc = this.data.screens[this.i];
    if (!sc || this.i >= this.data.screens.length - 1) { if (!this.live) this.pause(); return; }
    // Real time spent on the screen, sped up; long idle gaps capped at 30s
    const real = Math.min(30000, Math.max(800, new Date(sc.until) - new Date(sc.at)));
    this.timer = setTimeout(() => { this.i++; this.show(); this.schedule(); }, Math.max(700, real / this.speed));
  },
  schedulePoll() {
    this.poll = setTimeout(async () => {
      if (!this.live || !$('#rpScr')) return;
      if (!document.hidden) {
        try {
          const d = await API.get(`/master/users/${this.uid}/replay/?live=1`);
          const atEnd = this.i >= this.data.screens.length - 1;
          const grew = d.screens.length !== this.data.screens.length;
          this.data = d;
          if (grew) { const keep = atEnd ? d.screens.length - 1 : this.i; this.layout(); this.i = keep; this.show(); }
        } catch (e) { /* keep showing what we have */ }
      }
      this.schedulePoll();
    }, 5000);
  },
  show() {
    const d = this.data, sc = d.screens[this.i], scr = $('#rpScr');
    if (!scr) return;
    if (!sc) { scr.innerHTML = this.frame('<div style="padding:60px 20px;text-align:center;color:#888;">No activity to replay here.</div>', 'home'); $('#rpNow').textContent = ''; return; }
    scr.innerHTML = this.frame(this.render(sc), sc.type);
    // a "tap" where the action happened
    const tapAt = { book: [160, 600], read: [250, 320], unlock: [160, 560], gift: [160, 520], store: [160, 300], rewards: [160, 300] }[sc.type];
    if (tapAt) { const t = document.createElement('div'); t.className = 'tap'; t.style.left = (tapAt[0] - 30) + 'px'; t.style.top = (tapAt[1] - 70) + 'px'; scr.appendChild(t); }
    document.querySelectorAll('#rpList .rp-item').forEach(x => x.classList.toggle('on', +x.dataset.i === this.i));
    document.querySelector(`#rpList .rp-item[data-i="${this.i}"]`)?.scrollIntoView({ block: 'nearest' });
    const sc0 = d.screens[0], last = d.screens[d.screens.length - 1];
    const span = Math.max(1, new Date(last.until) - new Date(sc0.at));
    const head = $('#rpHead'); if (head) head.style.left = ((new Date(sc.at) - new Date(sc0.at)) / span * 100).toFixed(2) + '%';
    $('#rpNow').innerHTML = `${_d(sc.at)} · ${_e(sc.platform)}${sc.place ? ' · ' + flag(sc.country_code) + ' ' + _e(sc.place) : ''} · screen ${this.i + 1} of ${d.screens.length} · stayed ${this.dur(sc)}`;
  },
  frame(inner, type) {
    const tab = { home: 0, search: 0, book: 0, read: 0, unlock: 0, ad_access: 0, download: 0, library: 1, rewards: 2, wallet: 3, store: 3, redeem: 3, profile: 3, notifications: 3 }[type] ?? 0;
    const t = new Date(this.data.screens[this.i]?.at || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    const reading = ['read', 'unlock', 'ad_access'].includes(type);
    return `<div class="sbar"><span>${t}</span><span>▮▮▮ ◔</span></div><div class="body">${inner}</div>` + (reading ? '' :
      `<div class="nav">${['Explore', 'Library', 'Rewards', 'Me'].map((x, k) => `<span class="${k === tab ? 'on' : ''}"><b>${['⌂', '▤', '🎁', '☺'][k]}</b>${x}</span>`).join('')}</div>`);
  },
  cover(st, h) {
    const bg = st && st.cover ? `background-image:url('${_e(st.cover)}')` : '';
    return `<div class="cv" style="${bg};${h ? 'height:' + h + 'px;aspect-ratio:auto;' : ''}">${st && !st.cover ? _e(st.title) : ''}</div>`;

      case 'wallet': return `<div class="a-sec" style="font-size:16px;padding-top:10px;">My wallet</div><div style="margin:10px 14px;padding:16px;border-radius:14px;background:linear-gradient(135deg,#C15F3C,#5b2412);"><div style="font-size:11px;opacity:.8;">Coins</div><div style="font-size:26px;font-weight:800;">${_n(u.coins)}</div><div style="font-size:11px;opacity:.8;">+${_n(u.bonus)} bonus</div></div>`;
      case 'gift': return `${st.title ? `<div style="display:flex;gap:10px;padding:10px 14px;opacity:.55;"><div style="width:70px;">${this.cover(st)}</div><b>${_e(st.title)}</b></div>` : ''}<div class="a-sheet"><div style="font-weight:700;font-size:14px;margin-bottom:10px;">🎁 Send a gift</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">${['☕', '🌹', '💎', '👑'].map(x => `<div style="text-align:center;padding:10px 0;background:#2a2a30;border-radius:10px;font-size:18px;">${x}</div>`).join('')}</div><div class="a-btn" style="margin:12px 0 0;">Send</div></div>`;
      case 'comments': return `<div class="a-sec" style="font-size:15px;padding-top:10px;">Comments</div><div style="padding:0 14px;color:#888;">${_e(st.title || '')}</div>${['Loved this chapter!', 'Can’t wait for the next one 😭', 'Plot twist 🔥'].map(x => `<div style="margin:8px 14px;padding:10px;border-radius:12px;background:#1c1c20;">${x}</div>`).join('')}`;
      case 'listen': return `<div style="padding:20px 30px;">${this.cover(st.title ? st : books[0])}</div><div style="text-align:center;font-weight:700;">${_e(st.title || 'Listening')}</div><div style="margin:14px 24px;height:4px;background:#2a2a30;border-radius:2px;"><div style="width:35%;height:100%;background:#C15F3C;border-radius:2px;"></div></div><div style="text-align:center;font-size:26px;">⏮ ⏸ ⏭</div>`;
      case 'library': return `<div class="a-sec" style="font-size:16px;padding-top:10px;">Library</div><div class="a-grid">${homeGrid}</div>`;
      case 'profile': return `<div style="text-align:center;padding:26px 14px;"><div class="av" style="width:64px;height:64px;margin:0 auto;font-size:24px;">${_e((u.username || '?')[0].toUpperCase())}</div><div style="font-weight:700;margin-top:8px;">${_e(u.username)}</div><div style="color:#888;">${_n(u.coins)} coins</div></div>`;
      case 'notifications': return `<div class="a-sec" style="font-size:16px;padding-top:10px;">Notifications</div>${['New chapter from an author you follow', 'Your daily reward is ready', 'Someone replied to your comment'].map(x => `<div style="margin:8px 14px;padding:10px;border-radius:12px;background:#1c1c20;">${x}</div>`).join('')}`;
      case 'login': case 'signup': return `<div style="padding:60px 24px;text-align:center;"><div class="a-head" style="justify-content:center;"><span class="lg">H</span><b style="color:#C15F3C;font-size:18px;">HuxNovel</b></div><div style="margin-top:20px;font-weight:700;font-size:16px;">${sc.type === 'login' ? 'Signing in…' : 'Creating account…'}</div><div class="a-btn">Continue with Google</div></div>`;
      case 'app_open': return `<div style="height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;"><span class="lg" style="width:56px;height:56px;border-radius:16px;background:#C15F3C;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;">H</span><b>Opening HuxNovel…</b></div>`;
      case 'author_dashboard': case 'editor_dashboard': return `<div style="padding:30px 18px;"><div style="font-weight:700;font-size:15px;">${sc.type === 'author_dashboard' ? 'Author dashboard' : 'Editor dashboard'}</div><div style="color:#888;margin-top:6px;">(website)</div></div>`;
      default: return `<div style="padding:40px 18px;color:#bbb;">${_e(sc.doing)}</div>`;
    }
  },
};

// ── Audience ─────────────────────────────────────────────────────────────────

  try {
    const d = await API.get('/master/audience/?days=' + days);
    el.innerHTML = `
      <div class="grid two">
        <div class="card"><h3>Age</h3><div class="chart sm"><canvas id="cAge"></canvas></div></div>
        <div class="card"><h3>Favourite genres</h3>${barList(d.genres, r => _e(r.name), r => r.value)}</div>
        <div class="card"><h3>Time of day <span class="sub">requests by hour (server time)</span></h3><div class="chart sm"><canvas id="cHours"></canvas></div></div>
        <div class="card"><h3>Operating systems</h3>${barList(d.os, r => _e(r.os), r => r.n)}</div>
        <div class="card"><h3>App versions <span class="sub">active installs</span></h3>${table(['Platform', 'Version', 'Installs'], d.app_versions.map(x => [_e(x.platform), _e(x.app_version), _n(x.n)]))}</div>
        <div class="card"><h3>Languages</h3>${barList(d.languages, r => _e(r.preferred_language), r => r.n)}</div>
      </div>
      <div class="card" style="margin-top:12px;"><h3>Retention by sign-up week <span class="sub">share who came back</span></h3>
        ${table(['Week of', 'Signed up', 'Day 1', 'Day 7', 'Day 30'], d.retention.map(c => [_dd(c.week), _n(c.size),
          ...['d1', 'd7', 'd30'].map(k => c.size ? `<span class="bdg" style="background:color-mix(in srgb,var(--role) ${Math.round(c[k] * 100)}%,var(--muted));color:${c[k] > .4 ? '#fff' : 'inherit'}">${_pct(c[k])}</span>` : '—')]))}</div>
      <div class="grid two" style="margin-top:12px;">
        <div class="card"><h3>Most used screens & endpoints</h3>${table(['What', 'Path', 'Requests'], d.top_paths.map(x => [_e(x.label), `<code class="sm">${_e(x.path)}</code>`, _n(x.hits)]))}</div>
        <div class="card"><h3>Where web visitors come from</h3>${table(['Referrer', 'Visits'], d.referrers.map(x => [`<span class="sm">${_e(x.referrer)}</span>`, _n(x.n)]), 'No outside referrers yet.')}</div>
      </div>`;
    chart('cAge', 'bar', d.ages.map(a => a.name), [{ label: 'Users', data: d.ages.map(a => a.value) }], { plugins: { legend: { display: false } } });
    chart('cHours', 'bar', d.hours.map((_, h) => h + ':00'), [{ label: 'Requests', data: d.hours }], { plugins: { legend: { display: false } } });
  } catch (e) { el.innerHTML = err(e); }
};

// ── Team ─────────────────────────────────────────────────────────────────────
function editorStats(s) {
  return `<div class="grid kpis">
    ${kpi('Authors', _n(s.authors), `+${_n(s.new_authors)} recently`)}
    ${kpi('Chapters reviewed', _n(s.chapters_reviewed), `${_n(s.chapters_reviewed_period)} recently`)}
    ${kpi('Edits reviewed', _n(s.edits_reviewed))}
    ${kpi('Applications', _n(s.applications), `${_n(s.applications_pending)} pending`)}
    ${kpi('Approved', _n(s.applications_approved), `${_n(s.applications_rejected)} rejected`)}
    ${kpi('Contracts sent', _n(s.contracts_sent))}
    ${kpi('Signed', _n(s.contracts_signed), `${_n(s.contracts_signed_period)} recently`, true)}
    ${kpi('CE signatures', _n(s.ce_signed))}
    ${kpi('KYC reviewed', _n(s.kyc_reviewed))}
    ${kpi('Earnings approved', _n(s.earnings_approved))}
    ${kpi('Promotions', _n(s.promotions + s.promotion_requests))}
    ${kpi('Invites sent', _n(s.invites_sent), `${_n(s.warnings_issued)} warnings · ${_n(s.notes_written)} notes`)}
  </div>`;
}
loaders.team = async () => {
  const el = $('#page-team');
  try {
    const d = await API.get('/master/team/?days=' + days);
    el.innerHTML = `<div class="card"><h3>Editorial team <span class="sub">${d.editors.length} editors · ${periodLabel()}</span></h3><div class="scroll"><table class="tbl">
      <thead><tr><th></th><th>Editor</th><th>Role</th><th>Last active</th><th>Active days</th><th>Authors</th><th>Chapters reviewed</th><th>Applications</th><th>Signed</th><th>KYC</th><th>Activity</th></tr></thead><tbody>
      ${d.editors.map((e, i) => `<tr class="click" onclick="openEditor(${e.id})">
        <td><span class="dot ${e.online ? 'on' : ''}"></span></td>
        <td>${who(e, e.supervisor ? 'reports to ' + _e(e.supervisor) : _e(e.email))}</td><td>${roleBdg(e.role)}</td>
        <td class="sm" style="white-space:nowrap;">${ago(e.last_seen)}</td>
        <td>${_n(e.active_days)} / ${days}</td>
        <td>${_n(e.stats.authors)}</td>
        <td>${_n(e.stats.chapters_reviewed_period)} <span class="muted sm">/ ${_n(e.stats.chapters_reviewed)}</span></td>
        <td>${_n(e.stats.applications)} <span class="muted sm">${_n(e.stats.applications_pending)} pending</span></td>
        <td>${_n(e.stats.contracts_signed)}</td><td>${_n(e.stats.kyc_reviewed)}</td>
        <td style="width:140px;"><div style="height:34px;"><canvas id="spark${i}"></canvas></div></td></tr>`).join('') || '<tr><td colspan="11" class="empty">No editors yet.</td></tr>'}
      </tbody></table></div></div>`;
    d.editors.forEach((e, i) => chart('spark' + i, 'line', e.activity.map(x => x.date), [{ data: e.activity.map(x => x.value) }],
      { plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } } }));
  } catch (e) { el.innerHTML = err(e); }
};

async function openEditor(id) {
  openDrawer();
  $('#drHead').innerHTML = '<div class="muted">Loading…</div>'; $('#drTabs').innerHTML = ''; $('#drBody').innerHTML = '';
  let d;
  try { d = await API.get('/master/team/' + id + '/'); }
  catch (e) { $('#drBody').innerHTML = err(e); return; }
  const ed = d.editor;
  $('#drHead').innerHTML = `${avatar(ed)}<div style="flex:1;min-width:0;"><div style="font-size:16px;font-weight:700;">${_e(ed.username)} ${roleBdg(ed.role)}</div>
      <div class="muted sm">${_e(ed.email)} · joined ${_dd(ed.date_joined)}</div></div>
    <button class="btn" onclick="openUser(${ed.id})">Activity & profile</button><button class="icon-btn" onclick="closeDrawer()">✕</button>`;
  setTabs([['work', 'Work'], ['authors', `Authors (${d.authors.length})`], ['log', 'Activity log']], t => {
    const b = $('#drBody');
    if (t === 'work') b.innerHTML = editorStats(ed.stats);
    else if (t === 'authors') b.innerHTML = d.authors.map(a => `<div class="card" style="margin-bottom:10px;">
        <div class="row" style="cursor:pointer;" onclick="openUser(${a.id})">${who(a, `${_e(a.pen_name || a.email)} · KYC ${_e(a.kyc)} · linked ${_dd(a.linked_at)} (${_e(a.link_method)})`)}
          <span class="muted sm" style="margin-left:auto;">last active ${ago(a.last_seen)}</span></div>
        ${a.books.length ? `<div style="margin-top:8px;">${table(['Book', 'Status', 'Contract', 'Chapters', 'Views', 'Updated'],
          a.books.map(x => [_e(x.title), _e(x.status), `<span class="bdg ${x.contract_status === 'signed' ? 'ok' : ''}">${_e(x.contract_status)}</span>`, _n(x.chapters), _n(x.views), _dd(x.updated_at)]))}</div>` : '<div class="muted sm" style="margin-top:6px;">No books yet.</div>'}
      </div>`).join('') || '<div class="empty">No authors linked.</div>';
    else b.innerHTML = `<div class="card">${d.log.map(x => `<div class="tl-item"><span class="when">${_d(x.at)}</span><span>${_e(x.what)}</span></div>`).join('') || '<div class="empty">Nothing recorded yet.</div>'}</div>`;
  });
}

// ── Books ────────────────────────────────────────────────────────────────────
loaders.books = async () => {
  const el = $('#page-books');
  try {
    const d = await API.get('/master/books/?days=' + days);
    const p = d.pipeline;
    const stages = [['Eligible, not applied', p.eligible_not_applied], ['Under review', p.under_review], ['SE approved', p.se_approved], ['Contract sent', p.contract_sent], ['Awaiting signature', p.awaiting_signature], ['Signed', p.signed], ['Rejected', p.rejected]];
    const book = b => [`<a href="/explore/${_e(b.slug)}/" target="_blank" style="font-weight:600;">${_e(b.title)}</a>`, `<a href="#" style="color:var(--role)" onclick="event.preventDefault();openUser(${b.author_id})">${_e(b.author)}</a>`];
    el.innerHTML = `
      <div class="grid kpis">${stages.map(([l, v]) => kpi(l, _n(v || 0))).join('')}${kpi('No contract', _n(p.none || 0))}</div>
      <div class="card" style="margin-top:12px;"><h3>Most read <span class="sub">${periodLabel()}</span></h3>${table(['Book', 'Author', 'Chapters opened', 'Readers', 'Views', 'Unlocks', 'Chapters', 'Contract', 'Rating'],
        d.top_books.map(b => [...book(b), _n(b.period_reads), _n(b.period_readers), _n(b.views), _n(b.unlocks), _n(b.chapters), _e(b.contract_status), b.rating.toFixed(1)]))}</div>
      <div class="grid two" style="margin-top:12px;">
        <div class="card"><h3>All-time most viewed</h3>${table(['Book', 'Author', 'Views', 'Likes'], d.all_time_top.map(b => [...book(b), _n(b.views), _n(b.likes)]))}</div>
        <div class="card"><h3>Recently signed</h3>${table(['Book', 'Author', 'Editor', 'Signed'], d.recent_signed.map(x => [_e(x.story), _e(x.author), _e(x.se), _dd(x.signed_at)]))}</div>
      </div>
      <div class="card" style="margin-top:12px;"><h3>New books <span class="sub">${periodLabel()}</span></h3>${table(['Book', 'Author', 'Status', 'Chapters', 'Created'],
        d.new_books.map(b => [...book(b), _e(b.status), _n(b.chapters), _dd(b.created_at)]))}</div>`;
  } catch (e) { el.innerHTML = err(e); }
};

// ── Revenue ──────────────────────────────────────────────────────────────────
loaders.revenue = async () => {
  const el = $('#page-revenue');
  try {
    const d = await API.get('/master/revenue/?days=' + days);
    const type = t => ({ coin_pack: 'Coin packs', subscription: 'VIP subscriptions' }[t] || t);
    el.innerHTML = `
      <div class="grid kpis">${kpi('Revenue', _usd(d.total_usd), periodLabel(), true)}${kpi('Purchases', _n(d.purchases))}${kpi('Refunds', _n(d.refunds))}
        ${kpi('Gifts (real money)', _usd(d.gifts_usd))}${kpi('VIP active', _n(d.vip_active))}${kpi('Author earnings held', _n(d.author_earnings_held_coins) + ' coins', `${_n(d.author_earnings_released_coins)} released ${periodLabel()}`)}</div>
      <div class="grid two two-1" style="margin-top:12px;">
        <div class="card"><h3>Revenue per day</h3><div class="chart"><canvas id="cRev2"></canvas></div></div>
        <div class="card"><h3>By product</h3>${barList(d.by_type, r => `${type(r.type)} <span class="muted sm">· ${_n(r.n)}</span>`, r => r.usd, _usd)}
          <h3 style="margin-top:16px;">Author payouts</h3>${table(['Status', 'Count', 'USD'], d.payouts.map(x => [_e(x.status), _n(x.n), _usd(x.usd)]), 'No payouts yet.')}</div>
      </div>
      <div class="card" style="margin-top:12px;"><h3>Top spenders <span class="sub">all time</span></h3>${table(['User', 'Purchases', 'Spent'],
        d.top_spenders.map(x => [`<a href="#" style="color:var(--role);font-weight:600;" onclick="event.preventDefault();openUser(${x.user_id})">${_e(x.username)}</a>`, _n(x.n), _usd(x.usd)]))}</div>`;
    chart('cRev2', 'bar', d.daily.map(x => shortDate(x.date)), [{ label: 'USD', data: d.daily.map(x => x.value) }], { plugins: { legend: { display: false } } });
  } catch (e) { el.innerHTML = err(e); }
};

// ── Start ────────────────────────────────────────────────────────────────────
go(titles[location.hash.slice(1)] ? location.hash.slice(1) : 'overview');
// Coming back to a hidden tab on Realtime: refresh now and resume polling
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && page === 'realtime') loaders.realtime();
});
window.addEventListener('hashchange', () => {
  const p = location.hash.slice(1);
  if (titles[p] && p !== page) go(p);
});
</script>
