{% load static %}<script>
(function(){
  var t=localStorage.getItem('nux_theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  var h=document.documentElement;
  h.classList.toggle('dark',t==='dark');
  window._nuxTheme=t;
  window._nuxSetTheme=function(v){window._nuxTheme=v;localStorage.setItem('nux_theme',v);h.classList.toggle('dark',v==='dark');};
})();
</script>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/png" href="{% static 'novelux/images/favicon_circle.png' %}">
<meta name="description" content="{{ og.description }}"/>
<link rel="canonical" href="{{ og.url }}"/>
<meta property="og:type"        content="{{ og.type }}"/>
<meta property="og:site_name"   content="HuxNovel"/>
<meta property="og:title"       content="{{ og.title }}"/>
<meta property="og:description" content="{{ og.description }}"/>
<meta property="og:url"         content="{{ og.url }}"/>
{% if og.image %}<meta property="og:image" content="{{ og.image }}"/>{% endif %}
<meta name="twitter:card"        content="{% if og.image %}summary_large_image{% else %}summary{% endif %}"/>
<meta name="twitter:title"       content="{{ og.title }}"/>
<meta name="twitter:description" content="{{ og.description }}"/>
{% if og.image %}<meta name="twitter:image" content="{{ og.image }}"/>{% endif %}
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet"/>
<style>
:root{--bg:hsl(0 0% 100%);--fg:hsl(0 0% 9%);--card:hsl(0 0% 99%);--primary:hsl(14 62% 38%);--primary-fg:#fff;
  --muted:hsl(0 0% 96%);--muted-fg:hsl(0 0% 42%);--border:hsl(0 0% 90%);--lock:hsl(38 80% 42%);}
html.dark{--bg:hsl(240 6% 6%);--fg:hsl(0 0% 90%);--card:hsl(240 5% 9%);--muted:hsl(240 4% 14%);--muted-fg:hsl(0 0% 58%);--border:hsl(240 4% 22%);--lock:hsl(38 80% 60%);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{font-family:'Geist',system-ui,sans-serif;color:var(--fg);background:var(--bg);line-height:1.5;overflow-x:hidden;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px;}

nav.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
nav.top .wrap{height:60px;display:flex;align-items:center;gap:24px;}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;}
.brand img{width:30px;height:30px;border-radius:8px;object-fit:cover;}
.nav-links{display:flex;gap:22px;flex:1;font-size:14px;color:var(--muted-fg);}
.nav-links a:hover{color:var(--fg);}
.nav-actions{margin-left:auto;display:flex;gap:10px;align-items:center;}
@media(max-width:760px){.nav-links{display:none;}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 20px;border-radius:8px;font-size:14px;font-weight:600;transition:opacity .15s,background .15s;white-space:nowrap;}
.btn-primary{background:var(--primary);color:var(--primary-fg);}
.btn-primary:hover{opacity:.9;}
.btn-outline{border:1px solid var(--border);}
.btn-outline:hover{background:var(--muted);}
.btn-sm{height:34px;padding:0 14px;font-size:13px;}
.icon-btn{width:34px;height:34px;border:1px solid var(--border);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted-fg);}
.icon-btn:hover{background:var(--muted);}

.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;background:var(--muted);font-size:12px;color:var(--muted-fg);}
.lock{color:var(--lock);}
.app-cta{border:1px solid var(--border);border-radius:14px;padding:22px;background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 10%,transparent),transparent);display:flex;gap:18px;align-items:center;flex-wrap:wrap;}
.app-cta h3{font-size:17px;margin-bottom:4px;}
.app-cta p{font-size:13px;color:var(--muted-fg);}
.app-cta .btns{display:flex;gap:10px;flex-wrap:wrap;margin-left:auto;}
/* Official store badges. The Google PNG has transparent padding built in, so
   it is drawn larger and pulled in to sit at the same visual height as Apple's. */
.store-badges{align-items:center;gap:12px;}
.store-badges a{display:inline-flex;line-height:0;transition:opacity .15s;}
.store-badges a:hover{opacity:.85;}
.badge-apple img{height:44px;width:auto;}
.badge-google{margin:-11px -11px;}
.badge-google img{height:66px;width:auto;}

footer.site{border-top:1px solid var(--border);margin-top:56px;padding:28px 0;font-size:13px;color:var(--muted-fg);}
footer.site .wrap{display:flex;gap:18px;flex-wrap:wrap;align-items:center;}
footer.site a:hover{color:var(--fg);}
</style>
